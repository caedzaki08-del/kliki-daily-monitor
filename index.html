<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KLIKI Daily Monitor</title>
<meta name="theme-color" content="#0B1F4B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{
  --bg:#F2F5FB; --card:#fff; --ink:#0F1B3D; --mute:#5C6B8A; --line:#E1E7F2;
  --navy:#0B1F4B; --blue:#1C4FD8; --yellow:#FFC400;
  --hit:#0A8F63; --hit-bg:#E3F6EE; --miss:#C8372D; --miss-bg:#FCE9E7; --idle:#9AA6BF; --idle-bg:#EEF1F7;
  --shadow:0 1px 2px rgba(15,27,61,.06),0 4px 14px rgba(15,27,61,.06);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0A1226;--card:#121D3A;--ink:#EAF0FF;--mute:#9DB0D6;--line:#22305A;
    --hit:#35D39D;--hit-bg:#0F3A30;--miss:#FF7A6E;--miss-bg:#431C1C;--idle:#6F7FA6;--idle-bg:#1A2647;--shadow:none}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}

/* header */
header{background:var(--navy);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 0 14px;position:sticky;top:0;z-index:10}
.hrow{display:flex;align-items:center;gap:10px;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:30px;height:30px;border-radius:8px;background:var(--yellow);color:var(--navy);display:grid;place-items:center;font-weight:800;font-size:16px;flex:none}
.brand b{display:block;font-size:16px;line-height:1.1}
.brand small{opacity:.75;font-size:11.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{background:rgba(255,255,255,.12);border:0;border-radius:10px;width:38px;height:38px;display:grid;place-items:center;color:#fff;flex:none}
.iconbtn.spin svg{animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.chips{display:flex;gap:6px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid rgba(255,255,255,.25);background:transparent;color:#fff;border-radius:999px;padding:6px 13px;white-space:nowrap;font-size:13.5px}
.chip[aria-pressed=true]{background:#fff;color:var(--navy);border-color:#fff;font-weight:600}
.chip small{opacity:.7;font-weight:400}

/* date nav */
.datebar{display:flex;align-items:center;gap:8px;margin:14px 0 8px}
.datebar .d{flex:1;text-align:center;background:var(--card);border-radius:12px;padding:8px 10px;box-shadow:var(--shadow)}
.datebar .d b{display:block;font-size:15px}
.datebar .d span{font-size:12px;color:var(--mute)}
.nav{background:var(--card);border:0;border-radius:12px;width:42px;height:46px;box-shadow:var(--shadow);font-size:18px}
.nav[disabled]{opacity:.35}
.latest{background:var(--blue);color:#fff;border:0;border-radius:12px;padding:0 12px;height:46px;font-size:13px}

/* day strip */
.strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(30px,1fr));gap:4px;margin:6px 0 4px}
.sq{border:2px solid transparent;border-radius:8px;height:34px;display:grid;place-items:center;font-size:12px;font-weight:600;background:var(--idle-bg);color:var(--idle);position:relative}
.sq.hit{background:var(--hit-bg);color:var(--hit)}
.sq.miss{background:var(--miss-bg);color:var(--miss)}
.sq.closed{background:transparent;border:1px dashed var(--line);color:var(--idle)}
.sq.sel{border-color:var(--blue);box-shadow:0 0 0 2px rgba(28,79,216,.25)}
.sq.today::after{content:"";position:absolute;bottom:3px;width:4px;height:4px;border-radius:50%;background:currentColor}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin:2px 0 14px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* outlet tabs */
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:4px 0 14px}
.tabs::-webkit-scrollbar{display:none}
.tab{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 14px;white-space:nowrap;font-weight:600;font-size:14px;display:flex;align-items:center;gap:7px}
.tab[aria-pressed=true]{background:var(--navy);color:#fff;border-color:var(--navy)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--idle)}
.dot.hit{background:var(--hit)}.dot.miss{background:var(--miss)}

/* cards */
.card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.card h2{margin:0 0 10px;font-size:15px}
.card h2 small{font-weight:400;color:var(--mute);font-size:12.5px;margin-left:6px}
.summary{display:flex;align-items:center;gap:12px;background:var(--navy);color:#fff;border-radius:16px;padding:14px 16px;margin-bottom:14px}
.summary .big{font-size:30px;font-weight:800;line-height:1}
.summary p{margin:0;font-size:13.5px;opacity:.9}
.kpis{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:760px){.kpis{grid-template-columns:repeat(3,1fr)}}
.kpi{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:10px}
.kpi .lab{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);font-weight:700;display:flex;justify-content:space-between;align-items:center}
.kpi .val{font-size:28px;font-weight:800;line-height:1.05}
.kpi .val small{font-size:13px;color:var(--mute);font-weight:500;margin-left:4px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:700}
.pill.hit{background:var(--hit-bg);color:var(--hit)}
.pill.miss{background:var(--miss-bg);color:var(--miss)}
.pill.idle{background:var(--idle-bg);color:var(--mute)}
.bar{height:9px;background:var(--idle-bg);border-radius:6px;position:relative;overflow:visible}
.bar>i{display:block;height:100%;border-radius:6px;background:var(--miss)}
.bar.hit>i{background:var(--hit)}
.bar::after{content:"";position:absolute;left:var(--mark,100%);top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.55;border-radius:2px}
.rows{display:grid;gap:6px;font-size:13.5px}
.rows div{display:flex;justify-content:space-between;gap:8px}
.rows span:first-child{color:var(--mute)}
.rows b{font-weight:600;text-align:right}
.hr{border-top:1px solid var(--line);margin:2px 0}

/* tables */
.tw{overflow-x:auto;margin:0 -4px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);text-align:right;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
td{padding:9px 6px;text-align:right;border-bottom:1px solid var(--line)}
@media(max-width:600px){th,td{padding-left:4px;padding-right:4px}td .sub{font-size:10.5px}table{font-size:12px}}
tr:last-child td{border-bottom:0}
tr.link{cursor:pointer}
tr.link:hover td{background:var(--idle-bg)}
tr.tot td{font-weight:700;background:var(--idle-bg)}
td .sub{display:block;font-size:11.5px;color:var(--mute);white-space:normal}
.ok{color:var(--hit);font-weight:700}.no{color:var(--miss);font-weight:700}.na{color:var(--idle)}
.mark{display:inline-block;width:18px;text-align:center;font-weight:800}
tr.sel td{background:rgba(28,79,216,.08)}
tr.closedrow td{color:var(--idle)}

/* chart */
.seg{display:inline-flex;background:var(--idle-bg);border-radius:10px;padding:3px;margin-bottom:8px}
.seg button{border:0;background:transparent;border-radius:8px;padding:5px 12px;font-size:13px;color:var(--mute)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
svg.chart{width:100%;height:auto;display:block}
.note{font-size:12.5px;color:var(--mute);margin:8px 0 0}
.banner{background:var(--miss-bg);color:var(--miss);border-radius:12px;padding:10px 14px;margin:12px 0;font-size:13.5px}
.banner.info{background:var(--idle-bg);color:var(--mute)}
.empty{padding:40px 16px;text-align:center;color:var(--mute)}
footer{color:var(--mute);font-size:12px;text-align:center;padding:10px 0 28px}

/* pin */
#gate{position:fixed;inset:0;background:var(--navy);z-index:50;display:none;place-items:center;padding:24px}
#gate.on{display:grid}
#gate form{background:var(--card);color:var(--ink);border-radius:18px;padding:24px;width:100%;max-width:330px;text-align:center}
#gate input{width:100%;font:inherit;font-size:22px;letter-spacing:.3em;text-align:center;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);margin:14px 0 10px}
#gate button{width:100%;border:0;border-radius:12px;background:var(--blue);color:#fff;padding:12px;font-weight:700}
#gate p{margin:6px 0 0;color:var(--miss);font-size:13px;min-height:18px}
</style>
</head>
<body>
<div id="gate"><form id="pinform"><div class="logo" style="margin:0 auto 10px;width:44px;height:44px;font-size:22px">K</div><b>KLIKI Daily Monitor</b><input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN" aria-label="PIN"><button>Masuk</button><p id="pinerr"></p></form></div>

<header>
  <div class="wrap">
    <div class="hrow">
      <div class="brand"><div class="logo">K</div><div><b>Daily Monitor</b><small id="asof">Memuatkan data…</small></div></div>
      <button class="iconbtn" id="refresh" aria-label="Muat semula data"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg></button>
    </div>
    <div class="chips" id="months"></div>
  </div>
</header>

<main class="wrap" id="app"><div class="empty">Memuatkan…</div></main>
<footer class="wrap">Sumber: MASTER SHEET SALES OUTLET (baca sahaja) · Aksesori tidak dikira dalam KPI</footer>

<script src="config.js"></script>
<script>
(() => {
'use strict';
const C = window.CONFIG;
const $ = s => document.querySelector(s);
const MONTHS = ['Januari','Februari','Mac','April','Mei','Jun','Julai','Ogos','September','Oktober','November','Disember'];
const MS = ['Jan','Feb','Mac','Apr','Mei','Jun','Jul','Ogo','Sep','Okt','Nov','Dis'];
const DOW = ['Ahad','Isnin','Selasa','Rabu','Khamis','Jumaat','Sabtu'];
const pad = n => String(n).padStart(2, '0');
const ymd = (y, m, d) => `${y}-${pad(m)}-${pad(d)}`;
const daysIn = (y, m) => new Date(y, m, 0).getDate();
const dowOf = (y, m, d) => new Date(y, m - 1, d).getDay();
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- format ---------- */
const nf0 = new Intl.NumberFormat('en-MY', { maximumFractionDigits: 0 });
const nf1 = new Intl.NumberFormat('en-MY', { maximumFractionDigits: 1, minimumFractionDigits: 1 });
const rm = n => (n < 0 ? '−' : '') + 'RM ' + nf0.format(Math.abs(Math.round(n)));
const rmS = n => (n < 0 ? '−' : '+') + 'RM ' + nf0.format(Math.abs(Math.round(n)));
const un = n => nf0.format(Math.round(n));
const unT = n => (Math.abs(n - Math.round(n)) < 0.05 ? nf0.format(Math.round(n)) : nf1.format(n));
const unS = n => (n < 0 ? '−' : '+') + nf1.format(Math.abs(n)).replace('.0', '');
const pct = (a, t) => t > 0 ? Math.round(a / t * 100) + '%' : '–';

/* ---------- CSV ---------- */
function parseCSV(text) {
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += ch; }
    else if (ch === '"') q = true;
    else if (ch === ',') { row.push(f); f = ''; }
    else if (ch === '\n') { row.push(f); rows.push(row); row = []; f = ''; }
    else if (ch !== '\r') f += ch;
  }
  if (f !== '' || row.length) { row.push(f); rows.push(row); }
  return rows;
}
function num(s) {
  if (s == null) return 0;
  s = String(s).trim(); if (!s) return 0;
  const neg = /^\(.*\)$/.test(s) || /^-/.test(s.replace(/RM/i, '').trim());
  const v = parseFloat(s.replace(/[^0-9.]/g, ''));
  return isNaN(v) ? 0 : (neg ? -v : v);
}
const norm = s => String(s || '').toUpperCase().replace(/\s+/g, ' ').trim();

/* ---------- load ---------- */
const gviz = tab => `https://docs.google.com/spreadsheets/d/${C.SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(tab)}&_=${Date.now()}`;
async function fetchTab(tab) {
  const r = await fetch(gviz(tab), { cache: 'no-store' });
  if (!r.ok) throw new Error(tab + ' HTTP ' + r.status);
  const t = await r.text();
  if (/^\s*<(!doctype|html)/i.test(t)) throw new Error('Sheet belum dikongsi (Anyone with the link – Viewer)');
  return parseCSV(t);
}
function findCol(H, prefix, names) {
  for (const n of names) { const i = H.get(norm(prefix + ' ' + n)); if (i != null) return i; }
  return -1;
}
// Hasil: data[dateKey][outletKey][catId] = {rm, u}
function extractData(rows) {
  const H = new Map(); rows[0].forEach((h, i) => { const k = norm(h); if (k && !H.has(k)) H.set(k, i); });
  const di = H.get('DATE'); if (di == null) throw new Error('Lajur DATE tiada dalam ' + C.TAB_DATA);
  const map = C.OUTLETS.map(o => ({ o, cats: C.CATS.map(c => ({ c, cols: o.cols.map(p => ({ r: findCol(H, p, c.rm), u: findCol(H, p, c.unit) })) })) }));
  const data = {};
  for (let r = 1; r < rows.length; r++) {
    const m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec((rows[r][di] || '').trim());
    if (!m) continue;
    const key = ymd(+m[3], +m[2], +m[1]);
    if (key < '2026-10-01') continue;
    const day = data[key] = {};
    for (const { o, cats } of map) {
      const od = day[o.key] = {};
      for (const { c, cols } of cats) {
        let a = 0, b = 0;
        for (const x of cols) { if (x.r >= 0) a += num(rows[r][x.r]); if (x.u >= 0) b += num(rows[r][x.u]); }
        od[c.id] = { rm: a, u: b };
      }
    }
  }
  return data;
}
function extractPlan(rows) {
  const H = rows[0].map(norm);
  const ix = n => H.indexOf(n);
  const iM = ix('BULAN'), iO = ix('OUTLET');
  if (iM < 0 || iO < 0) throw new Error('Tab PLAN: lajur BULAN/OUTLET tiada');
  const months = {};
  for (let r = 1; r < rows.length; r++) {
    const mm = /(\d{4})-(\d{1,2})/.exec(rows[r][iM] || ''); if (!mm) continue;
    const ym = `${mm[1]}-${pad(+mm[2])}`; const out = (rows[r][iO] || '').trim().toLowerCase(); if (!out) continue;
    const t = {};
    for (const c of C.CATS) t[c.id] = num(rows[r][ix(c.planRM)]);
    (months[ym] = months[ym] || {})[out] = t;
  }
  const apu = Object.assign({}, C.APU_FALLBACK);
  const iP = ix('PRODUK'), iA = ix('APU_SEPT_RM');
  if (iP >= 0 && iA >= 0) for (let r = 1; r < rows.length; r++) { const k = (rows[r][iP] || '').trim().toUpperCase(); const v = num(rows[r][iA]); if (k && v > 0) apu[k] = v; }
  let share = C.WEEK_SHARE_FALLBACK.slice();
  const iW = ix('MINGGU'), iK = ix('KONGSI');
  if (iW >= 0 && iK >= 0) {
    const s = [0, 0, 0, 0];
    for (let r = 1; r < rows.length; r++) {
      const w = /^W([1-4])$/i.exec((rows[r][iW] || '').trim()); if (!w) continue;
      const raw = String(rows[r][iK] || '').trim(); let v = num(raw); if (/%/.test(raw) || v > 1) v /= 100; s[w[1] - 1] = v;
    }
    if (s.every(x => x > 0) && Math.abs(s.reduce((a, b) => a + b) - 1) < 0.02) share = s;
  }
  return { months, apu, share };
}
async function load() {
  const [d, p] = await Promise.all([fetchTab(C.TAB_DATA), fetchTab(C.TAB_PLAN)]);
  return { data: extractData(d), plan: extractPlan(p), at: Date.now(), live: true };
}

/* ---------- model ---------- */
// bina siri harian satu outlet untuk satu bulan
function buildOutlet(o, ym, S) {
  const [Y, M] = ym.split('-').map(Number); const N = daysIn(Y, M);
  const planRow = (S.plan.months[ym] || {})[o.plan] || null;
  const open = [], week = [], opInWeek = [0, 0, 0, 0];
  for (let d = 1; d <= N; d++) {
    const k = ymd(Y, M, d);
    const off = (C.OFF_DATES[k] || []).includes(o.key) || o.closed.includes(dowOf(Y, M, d));
    open[d] = !off; week[d] = Math.min(3, Math.floor((d - 1) / 7)); if (!off) opInWeek[week[d]]++;
  }
  const cat = {};
  for (const c of C.CATS) {
    const mRM = planRow ? planRow[c.id] : 0, apu = S.plan.apu[c.apu] || 0, mU = apu > 0 ? Math.round(mRM / apu) : 0; // dibundarkan per outlet per bulan, ikut PDF target
    const a = { rm: [], u: [] }, t = { rm: [], u: [] };
    for (let d = 1; d <= N; d++) {
      const dd = (S.data[ymd(Y, M, d)] || {})[o.key];
      const x = dd && dd[c.id] ? dd[c.id] : { rm: 0, u: 0 };
      a.rm[d] = x.rm; a.u[d] = x.u;
      const f = open[d] && opInWeek[week[d]] ? S.plan.share[week[d]] / opInWeek[week[d]] : 0;
      t.rm[d] = mRM * f; t.u[d] = mU * f;
    }
    cat[c.id] = { a, t, monthRM: mRM, monthU: mU, apu };
  }
  return { o, N, Y, M, open, cat, hasPlan: !!planRow };
}
function combine(list) {
  if (list.length === 1) return list[0];
  const b = list[0], N = b.N, cat = {};
  for (const c of C.CATS) {
    const a = { rm: [], u: [] }, t = { rm: [], u: [] }; let mRM = 0, mU = 0;
    for (let d = 1; d <= N; d++) { a.rm[d] = a.u[d] = t.rm[d] = t.u[d] = 0; }
    for (const x of list) { const k = x.cat[c.id]; mRM += k.monthRM; mU += k.monthU;
      for (let d = 1; d <= N; d++) { a.rm[d] += k.a.rm[d]; a.u[d] += k.a.u[d]; t.rm[d] += k.t.rm[d]; t.u[d] += k.t.u[d]; } }
    cat[c.id] = { a, t, monthRM: mRM, monthU: mU, apu: (list.find(x => x.cat[c.id].apu) || { cat: {} }).cat[c.id] ? list.find(x => x.cat[c.id].apu).cat[c.id].apu : 0 };
  }
  const open = []; for (let d = 1; d <= N; d++) open[d] = list.some(x => x.open[d]);
  return { o: { key: 'all', name: 'Semua Outlet', short: 'SEMUA' }, N, Y: b.Y, M: b.M, open, cat, hasPlan: list.some(x => x.hasPlan) };
}
const PHONE = C.CATS.filter(c => !c.repair).map(c => c.id);
const ALLC = C.CATS.map(c => c.id);
const sum = (arr, from, to) => { let s = 0; for (let i = from; i <= to; i++) s += arr[i] || 0; return s; };
function series(m, ids, kind, which) { // jumlah harian beberapa kategori
  const out = []; for (let d = 1; d <= m.N; d++) { let s = 0; for (const id of ids) s += m.cat[id][which][kind][d]; out[d] = s; } return out;
}
// ringkasan KPI sehingga hari D
function kpis(m, D) {
  const mk = (ids, kind) => {
    const A = series(m, ids, kind, 'a'), T = series(m, ids, kind, 't');
    const mtdA = sum(A, 1, D), mtdT = sum(T, 1, D), monthT = sum(T, 1, m.N);
    let left = 0; for (let d = D + 1; d <= m.N; d++) if (m.open[d]) left++;
    const need = left > 0 ? Math.max(0, monthT - mtdA) / left : null;
    const proj = mtdT > 0 ? mtdA / mtdT * monthT : null;
    return { A, T, day: A[D], dayT: T[D], mtdA, mtdT, monthT, left, need, proj };
  };
  const sales = mk(ALLC, 'rm'), unit = mk(PHONE, 'u'), phoneRM = mk(PHONE, 'rm');
  const apuDay = unit.day > 0 ? phoneRM.day / unit.day : null;
  const apuA = unit.mtdA > 0 ? phoneRM.mtdA / unit.mtdA : null;

  app.innerHTML = html;
  $('#asof').textContent = `Data terkini: ${latest} ${MS[M - 1]} · dikemas kini ${new Date(S.store.at).toLocaleTimeString('ms-MY', { hour: '2-digit', minute: '2-digit' })}${S.store.live ? '' : ' (tersimpan)'}`;
  app.querySelectorAll('[data-scope]').forEach(e => e.onclick = () => { S.scope = e.dataset.scope; render(); window.scrollTo({ top: 0 }); });
  app.querySelectorAll('[data-day]').forEach(e => e.onclick = () => { if (e.disabled) return; S.day = +e.dataset.day; render(); });
  app.querySelectorAll('[data-chart]').forEach(e => e.onclick = () => { S.chart = e.dataset.chart; render(); });
  const p = $('#prev'), n = $('#next'), l = $('#latest');
  if (p) p.onclick = () => { S.day--; render(); }; if (n) n.onclick = () => { S.day++; render(); }; if (l) l.onclick = () => { S.day = latestDay(models); render(); };
  document.querySelectorAll('#months [data-month]').forEach(e => e.onclick = () => { S.ym = e.dataset.month; S.day = latestDay(modelFor(S.ym)); render(); });
}

/* ---------- boot ---------- */
const CK = 'kliki-daily-cache-v1';
async function refresh(manual) {
  const btn = $('#refresh'); btn.classList.add('spin');
  try {
    S.store = await load(); S.err = null;
    try { localStorage.setItem(CK, JSON.stringify(S.store)); } catch (e) {}
  } catch (e) {
    S.err = e.message || String(e);
    if (!S.store) { try { const c = JSON.parse(localStorage.getItem(CK)); if (c) { c.live = false; S.store = c; } } catch (x) {} }
  }
  btn.classList.remove('spin');
  if (!S.store) { $('#app').innerHTML = `<div class="banner">Tak dapat ambil data: ${esc(S.err)}<br>Pastikan MASTER SHEET dikongsi sebagai <b>Anyone with the link – Viewer</b> dan nama tab (${esc(C.TAB_DATA)}, ${esc(C.TAB_PLAN)}) betul dalam config.js.</div>`; return; }
  if (!S.ym || !monthKeys().includes(S.ym)) { S.ym = chooseMonth(); S.day = latestDay(modelFor(S.ym)); }
  render();
}
async function sha(s) { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }
function start() {
  refresh();
  setInterval(() => { if (!document.hidden) refresh(); }, C.REFRESH_MINUTES * 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden && S.store && Date.now() - S.store.at > 60000) refresh(); });
  $('#refresh').onclick = () => refresh(true);
}
function gate() {
  let ok = false; try { ok = localStorage.getItem('kliki-daily-ok') === C.PIN_HASH; } catch (e) {}
  if (!C.PIN_HASH || ok) return start();
  $('#gate').classList.add('on');
  $('#pinform').onsubmit = async e => {
    e.preventDefault();
    try {
      if ((await sha($('#pin').value.trim())) === C.PIN_HASH) { localStorage.setItem('kliki-daily-ok', C.PIN_HASH); $('#gate').classList.remove('on'); start(); }
      else { $('#pinerr').textContent = 'PIN salah'; $('#pin').value = ''; }
    } catch (x) { $('#pinerr').textContent = 'Buka melalui https (GitHub Pages).'; }
  };
}
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
try { gate(); } catch (e) { start(); }
})();
</script>
